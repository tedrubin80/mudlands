<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudlands Online - Graphical Client</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #phaser-game {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
        }

        #text-interface {
            height: 250px;
            background: #0f0f0f;
            border-top: 2px solid #333;
            display: flex;
            flex-direction: column;
        }

        #output-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        #input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #333;
        }

        #command-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #0f0;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        #command-input:focus {
            outline: none;
            border-color: #0f0;
        }

        .message {
            margin-bottom: 5px;
        }

        .room-name {
            color: #00ffff;
            font-weight: bold;
        }

        .npc-text {
            color: #ffff00;
        }

        .error {
            color: #ff4444;
        }

        .success {
            color: #00ff00;
        }

        .info {
            color: #aaaaaa;
        }

        #connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }

        #connection-status.connected {
            border-color: #0f0;
            color: #0f0;
        }

        #connection-status.disconnected {
            border-color: #f00;
            color: #f00;
        }

        .mode-link {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ffff;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
            color: #00ffff;
            text-decoration: none;
            transition: all 0.3s;
        }

        .mode-link:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <a href="/" class="mode-link">📝 Text Mode</a>
        <div id="connection-status" class="disconnected">Connecting...</div>

        <div id="phaser-game"></div>

        <div id="text-interface">
            <div id="output-area"></div>
            <div id="input-area">
                <input type="text" id="command-input" placeholder="Enter command..." autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Modular Renderers -->
    <script src="/js/room-renderer.js"></script>
    <script src="/js/entity-renderer.js"></script>
    <script src="/js/animation-manager.js"></script>
    <script src="/js/minimap.js"></script>

    <!-- Main Client -->
    <script src="/js/graphical-client.js"></script>
</body>
</html>
